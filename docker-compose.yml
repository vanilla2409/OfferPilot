version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: offerpilot-mysql
    environment:
      MYSQL_DATABASE: 'offerpilot'
      MYSQL_ROOT_PASSWORD: 'offerpilot123'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - offerpilot-network

  ai-service:
    build:
      context: ./ai-service
    container_name: offerpilot-ai
    ports:
      - "8000:8000"
    networks:
      - offerpilot-network

  backend:
    build:
      context: ./backend
    container_name: offerpilot-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/offerpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=offerpilot123
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ai-service
    networks:
      - offerpilot-network

  frontend:
    build:
      context: ./frontend
    container_name: offerpilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - offerpilot-network

networks:
  offerpilot-network:
    driver: bridge

volumes:
  db_data:
