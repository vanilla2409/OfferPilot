# Application Configuration
spring.application.name=offerpilot-backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/offerpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=offerpilot123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=offerpilot-super-secret-key-for-jwt-signing-2024-must-be-at-least-256-bits
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/resumes

# Python AI Service URL
ai.service.url=http://localhost:8000

# Server
server.port=8080
server.error.include-message=always
